# Weekly dependency updates (ADR-028, ADR-029); each update is a pull request to dev that runs the CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/docker
    target-branch: dev
    schedule:
      interval: weekly
