# Production on the kasparov server (ADR-015), layered on compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  api:
    image: heavy-duty-api
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: api
    command: !reset null
    environment: !override
      NODE_ENV: production
      PORT: "3001"
      DATABASE_PATH: /app/data/heavy-duty.sqlite
      # Public https origin of the app; the API refuses to start without it (ADR-019).
      APP_ORIGIN: ${APP_ORIGIN:-}
    # The production database lives outside the repository checkout (banco-de-dados.md, rule 7).
    volumes: !override
      - ${HEAVY_DUTY_DATA_DIR:-/srv/heavy-duty/data}:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      start_period: 30s
    restart: unless-stopped

  # Always on in production; the restic password comes from a host file (ADR-018).
  backup:
    profiles: !reset []
    image: heavy-duty-backup
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: backup
    command: !reset null
    environment: !override
      NODE_ENV: production
      DATABASE_PATH: /app/data/heavy-duty.sqlite
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup/restic}
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      BACKUP_TIME_ZONE: ${BACKUP_TIME_ZONE:-America/Sao_Paulo}
      BACKUP_DAILY_AT: ${BACKUP_DAILY_AT:-03:00}
    volumes: !override
      - ${HEAVY_DUTY_DATA_DIR:-/srv/heavy-duty/data}:/app/data
      - ${HEAVY_DUTY_BACKUP_DIR:-/srv/heavy-duty/backup}:/backup
      - ${HEAVY_DUTY_RESTIC_PASSWORD_FILE:-/srv/heavy-duty/secrets/restic-password}:/run/secrets/restic-password:ro
    restart: unless-stopped

  web:
    image: heavy-duty-web
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    command: !reset null
    environment: !override
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes: !reset []
    restart: unless-stopped

  # The tunnel routes by path in production, so the development proxy stays off.
  proxy:
    profiles: ["development"]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    # The run argument overrides the tunnel key of config.yml, so the ID stays in .env.
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
      - ${CLOUDFLARE_TUNNEL_ID:-<TUNNEL_ID>}
    volumes:
      - ./infra/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARE_TUNNEL_CREDENTIALS_FILE:-./infra/cloudflared/credentials.json}:/etc/cloudflared/credentials.json:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
