<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo do Heavy Duty v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout igual ao da v1: índice de telas à esquerda, celular no centro, notas da tela e simulação à direita. Tokens seguem DESIGN.md. */
:root{
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --page:#E9ECF2; --panel:#FFFFFF; --fg:#12151C; --fg-2:#596173; --line:#D8DCE4;
  --fill:rgba(118,124,140,.14); --fill-strong:rgba(118,124,140,.28);
  --accent:#2F55E4; --accent-fg:#FFFFFF; --accent-soft:rgba(47,85,228,.12);
  --success:#1E8A4C; --warning:#A86200; --danger:#C9302C;
  --app-bg:#F2F3F7; --app-card:#FFFFFF; --frame:#1A1D24;
  --shadow:0 10px 30px rgba(20,24,40,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0D12; --panel:#151922; --fg:#F1F3F8; --fg-2:#9EA6B6; --line:#272C37;
  --fill:rgba(140,148,166,.16); --fill-strong:rgba(140,148,166,.30);
  --accent:#7B96FF; --accent-fg:#0A0F22; --accent-soft:rgba(123,150,255,.16);
  --success:#41C47F; --warning:#F0A63A; --danger:#FF6B62;
  --app-bg:#06070A; --app-card:#171A22; --frame:#2A2E37;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0B0D12; --panel:#151922; --fg:#F1F3F8; --fg-2:#9EA6B6; --line:#272C37;
  --fill:rgba(140,148,166,.16); --fill-strong:rgba(140,148,166,.30);
  --accent:#7B96FF; --accent-fg:#0A0F22; --accent-soft:rgba(123,150,255,.16);
  --success:#41C47F; --warning:#F0A63A; --danger:#FF6B62;
  --app-bg:#06070A; --app-card:#171A22; --frame:#2A2E37;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{max-width:1480px;margin:0 auto;display:grid;gap:20px}
.top h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--fg-2);max-width:72ch}
.workspace{display:grid;gap:24px;grid-template-columns:240px minmax(0,1fr) 300px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.idx,.side{position:sticky;top:16px}
.idx-title{font-size:.9375rem;margin:2px 8px 0}
.idx-group h2{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:16px 8px 4px;font-weight:700}
.idx-items{display:grid;gap:2px}
.idx-item{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:12px;text-align:left;cursor:pointer}
.idx-item:hover{background:var(--fill)}
.idx-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side{display:grid;gap:16px}
.notes-title{font-size:1.125rem;margin:4px 0 2px}
.eyebrow{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:0}
.refs{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;color:var(--fg-2);margin:0 0 10px}
.notes-list{margin:0;padding-left:18px;display:grid;gap:8px}
.sim h2{font-size:.9375rem;margin:0 0 4px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--fill-strong);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.sim-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.sim .btn{font-size:.875rem;padding:0 12px}
@media (max-width:1180px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .idx,.side{position:static}
  .idx-items{display:flex;flex-wrap:wrap;gap:6px}
  .idx-item{width:auto;background:var(--fill)}
}

/* Celular */
.stage{display:flex;justify-content:center;min-width:0}
.phone{width:390px;max-width:100%;height:812px;padding:11px;border-radius:58px;background:var(--frame);box-shadow:var(--shadow)}
.screen{position:relative;height:100%;border-radius:47px;overflow:hidden;background:var(--app-bg);display:flex;flex-direction:column;isolation:isolate}
.status{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.status-r{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.batt{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px}
.batt i{display:block;height:100%;width:70%;background:currentColor;border-radius:1.5px}
.nosig{font-size:12px;color:var(--fg-2)}
.app-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.8;z-index:70;pointer-events:none}
@media (max-width:440px){.phone{padding:6px;border-radius:44px;height:760px}.screen{border-radius:38px}}

/* Conteúdo do app */
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.nav-row{display:flex;align-items:center;min-height:44px;padding-top:4px}
.large-title{font-size:2.125rem;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.nav-row + .large-title{margin-top:8px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s ease}
.icon-btn:active{background:var(--fill-strong);transform:scale(.94)}
.group-box{background:var(--app-card);border-radius:22px;overflow:hidden;list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:12px 16px;background:none;border:0;text-align:left;cursor:pointer;position:relative}
li + li > .row::before{content:"";position:absolute;top:0;left:76px;right:0;border-top:1px solid var(--line)}
.row:active{background:var(--fill)}
.letter{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:1.125rem;flex:none}
.letter.sug{background:var(--app-card);box-shadow:inset 0 0 0 3px var(--fg)}
.row-main{flex:1;min-width:0;display:grid;gap:4px}
.row-title{font-weight:600;font-size:1.0625rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{color:var(--fg-2);font-size:.875rem;display:flex;flex-wrap:wrap;gap:0 8px;font-variant-numeric:tabular-nums}
.chev{color:var(--fg-2)}
.pill{padding:4px 12px;border-radius:999px;background:var(--fill);font-weight:600;font-size:.8125rem}
.list-gap{margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--fill);font-weight:600;cursor:pointer;transition:transform .12s ease}
.btn:active{transform:scale(.97);background:var(--fill-strong)}
.btn-full{width:100%}
.more{display:grid;gap:12px;margin-top:16px}
.foot-note{color:var(--fg-2);font-size:.875rem;margin:0;text-align:center}
.empty-card{background:var(--app-card);border-radius:22px;padding:24px 20px;text-align:center;color:var(--fg-2);margin:0}
.skel{display:flex;align-items:center;gap:16px;height:72px;padding:0 16px}
.skel span{display:block;border-radius:999px;background:var(--fill)}
.skel .c{width:44px;height:44px;border-radius:50%}
.offline{display:grid;justify-items:center;gap:12px;text-align:center;padding:48px 16px 0}
.offline .ic{width:44px;height:44px;color:var(--fg-2)}
.offline{padding-top:160px}
.offline h1{margin:0 0 20px;font-size:1.75rem}
.btn-lg{min-height:64px;font-size:1.1875rem}

/* Detalhe */
.detail-head{display:flex;align-items:center;gap:16px;margin-top:8px}
.detail-head h1{font-size:1.75rem;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:0}
.detail-when{margin:2px 0 0;color:var(--fg-2);font-size:.9375rem}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.sec-title{font-size:.8125rem;font-weight:600;color:var(--fg-2);margin:24px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.ex-box{background:var(--app-card);border-radius:22px;list-style:none;margin:0;padding:4px 16px}
.ex-item{padding:12px 0;display:grid;gap:8px}
.ex-item + .ex-item{border-top:1px solid var(--line)}
.ex-name{font-weight:700;font-size:1rem;margin:0}
.sets{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.set{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border-radius:999px;background:var(--fill);font-weight:600;font-size:.875rem;font-variant-numeric:tabular-nums}
.set .k{color:var(--fg-2)}
.left-out{background:var(--app-card);border-radius:22px;list-style:none;margin:0;padding:4px 16px}
.left-out li{padding:12px 0;color:var(--fg-2);font-weight:600}
.left-out li + li{border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <header class="top">
    <h1>Protótipo do Heavy Duty v2</h1>
    <p>Histórico no celular (F20): a entrada pelo treino do dia, a lista dos treinos feitos e o detalhe só de leitura. As outras telas continuam na <a href="../v1/index.html">v1</a>. Dados de exemplo; a interface segue <code>DESIGN.md</code>.</p>
  </header>
  <div class="workspace">
    <nav class="idx card" id="idx" aria-label="Telas do protótipo"></nav>
    <main class="stage" id="stage"></main>
    <aside class="side">
      <section class="card" id="notes" aria-live="polite"></section>
      <section class="card sim" aria-label="Simulação">
        <h2>Simulação</h2>
        <label class="switch-row" for="opt-offline">Sem sinal no celular <input type="checkbox" class="switch" id="opt-offline"></label>
        <label class="switch-row" for="opt-empty">Sem treinos nos últimos 92 dias <input type="checkbox" class="switch" id="opt-empty"></label>
        <label class="switch-row" for="opt-loading">Carregando <input type="checkbox" class="switch" id="opt-loading"></label>
        <label class="switch-row" for="opt-dark">Tema escuro <input type="checkbox" class="switch" id="opt-dark"></label>
        <div class="sim-actions"><button class="btn" data-act="reset">Reiniciar</button></div>
      </section>
    </aside>
  </div>
</div>

<script>
(function(){
const NOW='2026-11-23T10:00:00-03:00';
const RANGE_DAYS=92;
const GROUP_LABEL={phone:'Celular · onda 4b (F20)'};
const SCREENS=[
  {id:'treino-do-dia',group:'phone',title:'Treino do dia',refs:'US-F20-01 · DESIGN.md 9.2',notes:[
    'O botão de ícone ao lado do título abre o histórico. É a única entrada: o app ainda não tem barra de abas (decisão do PO, com exceção registrada no DESIGN.md 9.2).',
    'O botão fica no topo, longe de "Próximo": o histórico não é passo do fluxo da academia e não pesa no treino.',
    'O nome acessível do botão é "Histórico".']},
  {id:'historico',group:'phone',title:'Histórico',refs:'US-F20-01 · F20 · D50',notes:[
    'Os treinos aparecem do mais recente para o mais antigo, com a letra, o nome da letra, a data e a duração.',
    'A primeira página traz os últimos 92 dias, o maior intervalo que GET /api/workouts aceita. "Treinos anteriores" busca os 92 dias antes da página mais antiga.',
    'Treino encerrado antes leva a marca "Encerrado antes". Treino sem fim registrado aparece sem duração.',
    'O histórico precisa de sinal: a API guarda os treinos, e o celular não guarda cópia. Sem sinal, aparece o aviso "Sem conexão" do app, com "Voltar ao treino do dia", porque o app instalado no iPhone não tem botão de voltar. Ligue "Sem sinal no celular" para ver a tela.',
    'O voltar fica no canto de cima, onde o atleta espera encontrá-lo (DESIGN.md 9.4).']},
  {id:'detalhe',group:'phone',title:'Detalhe do treino',refs:'US-F20-01 · D50 · DESIGN.md 9.4',notes:[
    'Só leitura: nenhum valor do treino muda no celular. A edição fica pelo Claude (D50, US-F06-02).',
    'Os exercícios seguem a ordem em que foram feitos. Cada série mostra o número, a carga em kg e as repetições ou os segundos, no padrão da lista de séries da sequência do treino.',
    'O leitor de tela lê cada série por extenso, como "Série 1: 42,5 kg, 10 repetições".',
    '"Ficaram de fora" lista os exercícios pulados e não feitos, como na tela de treino terminado.',
    'A duração vem do início e do fim do treino registrados (decisão do PO sobre a US-F03-08).',
    'A remoção do treino (US-F20-02) entra numa story própria, depois do descarte (US-F03-09).']}
];
const SCREEN=Object.fromEntries(SCREENS.map(s=>[s.id,s]));

const ICON={
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
  chevronL:'<path d="M15 18l-6-6 6-6"/>',
  chevronR:'<path d="M9 18l6-6-6-6"/>',
  wifiOff:'<path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg=g=>{const s=String(g/1000);return s.replace('.',',');};
const TZ='America/Sao_Paulo';
const nowYear=new Date(NOW).getFullYear();
function dateShort(iso){
  const d=new Date(iso);
  const opts={weekday:'short',day:'numeric',month:'short',timeZone:TZ};
  if(d.getFullYear()!==nowYear)opts.year='numeric';
  return d.toLocaleDateString('pt-BR',opts);
}
function dateLong(iso){
  const d=new Date(iso);
  const opts={weekday:'long',day:'numeric',month:'long',timeZone:TZ};
  if(d.getFullYear()!==nowYear)opts.year='numeric';
  return d.toLocaleDateString('pt-BR',opts);
}
const timeOf=iso=>new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:TZ}).replace(':','h');
const minutes=w=>w.finishedAt?Math.max(1,Math.round((new Date(w.finishedAt)-new Date(w.startedAt))/60000)):null;
const dayMs=86400000;
const rangeText=(fromMs,toMs)=>`${new Date(fromMs).toLocaleDateString('pt-BR',{day:'numeric',month:'short',timeZone:TZ})} a ${new Date(toMs-1).toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric',timeZone:TZ})}`;

const EX={
  supino:['Supino reto','reps'],inclinado:['Supino inclinado com halteres','reps'],polia:['Tríceps na polia','reps'],prancha:['Prancha','time'],
  puxada:['Puxada frontal','reps'],remada:['Remada baixa','reps'],rosca:['Rosca direta','reps'],
  agachamento:['Agachamento livre','reps'],legpress:['Leg press','reps'],desenvolvimento:['Desenvolvimento com halteres','reps']
};
const DAYS={A:'Peito e tríceps',B:'Costas e bíceps',C:'Pernas e ombros'};
const PLAN={
  A:[['supino',[[42500,10],[42500,10],[42500,8]]],['inclinado',[[14000,10],[14000,10],[14000,9]]],['polia',[[20000,12],[20000,12],[20000,12]]],['prancha',[[0,null,45],[0,null,45],[0,null,40]]]],
  B:[['puxada',[[45000,10],[45000,10],[45000,10]]],['remada',[[40000,10],[40000,10],[40000,10]]],['rosca',[[10000,12],[10000,12],[10000,10]]]],
  C:[['agachamento',[[50000,8],[50000,8],[50000,8],[50000,8]]],['legpress',[[120000,12],[120000,12],[120000,12]]],['desenvolvimento',[[12000,10],[12000,10],[12000,10]]]]
};
function workout(id,letter,start,mins,opts={}){
  const plan=opts.only?PLAN[letter].filter(([e])=>opts.only.includes(e)):PLAN[letter];
  return {id,letter,label:DAYS[letter],startedAt:start,
    finishedAt:mins?new Date(new Date(start).getTime()+mins*60000).toISOString():null,
    endReason:opts.endReason??(mins?'completed':null),
    exercises:plan.map(([e,sets])=>({name:EX[e][0],kind:EX[e][1],sets:sets.map(([loadG,reps,seconds],i)=>({setNumber:i+1,loadG,reps,seconds:seconds??null}))})),
    leftOut:(opts.leftOut||[]).map(e=>EX[e][0])};
}
// Do mais antigo ao mais recente, como GET /api/workouts devolve; a tela inverte a ordem.
const ALL=[
  workout('w01','B','2026-08-11T18:40:00-03:00',49),
  workout('w02','A','2026-08-14T18:35:00-03:00',55),
  workout('w03','C','2026-08-18T07:05:00-03:00',44),
  workout('w04','B','2026-11-10T18:50:00-03:00',47),
  workout('w05','C','2026-11-12T07:10:00-03:00',41),
  workout('w06','A','2026-11-14T09:20:00-03:00',58),
  workout('w07','B','2026-11-17T18:45:00-03:00',47),
  workout('w08','C','2026-11-19T07:10:00-03:00',29,{endReason:'ended_early',only:['agachamento','legpress'],leftOut:['desenvolvimento']}),
  workout('w09','A','2026-11-21T18:30:00-03:00',52)
];

function freshState(){return {screen:'treino-do-dia',online:true,empty:false,loading:false,pages:1,selected:'w09'};}
let S=freshState();
const nowMs=new Date(NOW).getTime();
const toMs=nowMs+dayMs;
function loaded(){
  const fromMs=toMs-S.pages*RANGE_DAYS*dayMs;
  return ALL.filter(w=>{const t=new Date(w.startedAt).getTime();return t>=fromMs&&t<toMs&&!(S.empty&&t>=toMs-RANGE_DAYS*dayMs);}).reverse();
}
function pageEmpty(page){
  const to=toMs-(page-1)*RANGE_DAYS*dayMs,from=to-RANGE_DAYS*dayMs;
  return {empty:!ALL.some(w=>{const t=new Date(w.startedAt).getTime();return t>=from&&t<to&&!(S.empty&&page===1);}),from,to};
}

function todayView(){
  return `<div class="app-scroll"><div class="head-row"><h1 class="large-title">Heavy Duty</h1>
    <button class="icon-btn" data-act="go" data-arg="historico" aria-label="Histórico">${icon('history')}</button></div>
    <ul class="group-box list-gap">${Object.entries(DAYS).map(([k,label])=>`<li><button class="row"><span class="letter${k==='B'?' sug':''}">${k}</span><span class="row-main"><span class="row-title">${esc(label)}</span></span>${k==='B'?'<span class="pill">Sugerida</span>':''}<span class="chev">${icon('chevronR')}</span></button></li>`).join('')}</ul></div>`;
}
function backRow(target,label){
  return `<div class="nav-row"><button class="icon-btn" data-act="go" data-arg="${target}" aria-label="${label}">${icon('chevronL')}</button></div>`;
}
function historyRow(w){
  const m=minutes(w);
  const meta=[dateShort(w.startedAt),m?`${m} min`:null,w.endReason==='ended_early'?'Encerrado antes':null].filter(Boolean);
  return `<li><button class="row" data-act="open" data-arg="${w.id}"><span class="letter">${w.letter}</span><span class="row-main"><span class="row-title">${esc(w.label||'Letra '+w.letter)}</span><span class="row-meta">${meta.map(x=>`<span>${esc(x)}</span>`).join('')}</span></span><span class="chev">${icon('chevronR')}</span></button></li>`;
}
function historyView(){
  if(!S.online)return `<div class="app-scroll"><div class="offline">${icon('wifiOff')}<h1>Sem conexão</h1>
    <button class="btn btn-full btn-lg" data-act="retry">Tentar de novo</button><button class="btn btn-full btn-lg" data-act="go" data-arg="treino-do-dia">Voltar ao treino do dia</button></div></div>`;
  if(S.loading)return `<div class="app-scroll">${backRow('treino-do-dia','Voltar ao treino do dia')}<h1 class="large-title">Histórico</h1>
    <div class="group-box list-gap" aria-hidden="true">${[1,2,3].map(()=>'<div class="skel"><span class="c"></span><span style="width:40%;height:14px"></span></div>').join('')}</div></div>`;
  const list=loaded();
  const notes=[];
  for(let p=1;p<=S.pages;p++){const r=pageEmpty(p);if(r.empty)notes.push(r);}
  const firstEmpty=list.length===0;
  const last=notes.find(n=>n.to===toMs-(S.pages-1)*RANGE_DAYS*dayMs);
  return `<div class="app-scroll">${backRow('treino-do-dia','Voltar ao treino do dia')}<h1 class="large-title">Histórico</h1>
    ${firstEmpty&&S.pages===1?'<p class="empty-card list-gap">Nenhum treino nos últimos 92 dias. Os treinos registrados no celular aparecem aqui.</p>':''}
    ${list.length?`<ul class="group-box list-gap" aria-label="Treinos">${list.map(historyRow).join('')}</ul>`:''}
    <div class="more">${last&&S.pages>1?`<p class="foot-note">Nenhum treino de ${esc(rangeText(last.from,last.to))}.</p>`:''}<button class="btn btn-full" data-act="more">Treinos anteriores</button></div></div>`;
}
function setItem(s){
  const time=s.seconds!==null;
  const amount=time?s.seconds:s.reps;
  const spoken=time?`${amount} ${amount===1?'segundo':'segundos'}`:`${amount} ${amount===1?'repetição':'repetições'}`;
  return `<li class="set"><span aria-hidden="true" style="display:contents"><span class="k">Série ${s.setNumber}</span><span>${kg(s.loadG)}<span class="k"> kg</span></span><span>${amount}<span class="k">${time?' s':' rep'}</span></span></span><span class="sr-only">Série ${s.setNumber}: ${kg(s.loadG)} kg, ${spoken}</span></li>`;
}
function detailView(){
  const w=ALL.find(x=>x.id===S.selected)||ALL[ALL.length-1];
  const m=minutes(w);
  const total=w.exercises.reduce((n,e)=>n+e.sets.length,0);
  const facts=[m?`${m} min`:null,`${w.exercises.length} ${w.exercises.length===1?'exercício':'exercícios'}`,`${total} ${total===1?'série':'séries'}`,w.endReason==='ended_early'?'Encerrado antes':null].filter(Boolean);
  return `<div class="app-scroll">${backRow('historico','Voltar ao histórico')}
    <div class="detail-head"><span class="letter" aria-hidden="true">${w.letter}</span><div><h1>${esc(w.label||'Letra '+w.letter)}</h1><p class="detail-when">${w.label?`Letra ${w.letter} · `:''}${esc(dateLong(w.startedAt))}, ${timeOf(w.startedAt)}</p></div></div>
    <ul class="facts">${facts.map(f=>`<li class="pill">${esc(f)}</li>`).join('')}</ul>
    <h2 class="sec-title">Exercícios</h2>
    <ul class="ex-box">${w.exercises.map(e=>`<li class="ex-item"><h3 class="ex-name">${esc(e.name)}</h3><ul class="sets" aria-label="Séries de ${esc(e.name)}">${e.sets.map(setItem).join('')}</ul></li>`).join('')}</ul>
    ${w.leftOut.length?`<h2 class="sec-title">Ficaram de fora</h2><ul class="left-out">${w.leftOut.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>`;
}
function phoneHTML(){
  const content=S.screen==='treino-do-dia'?todayView():S.screen==='historico'?historyView():detailView();
  const status=S.online?'<span class="sig"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>':'<span class="nosig">Sem sinal</span>';
  return `<div class="phone"><div class="screen" role="region" aria-label="Tela do celular">
    <div class="status" aria-hidden="true"><span>10:00</span><span class="status-r">${status}<span class="batt"><i></i></span></span></div>
    ${content}<div class="home-ind" aria-hidden="true"></div></div></div>`;
}

const idx=document.getElementById('idx'),stage=document.getElementById('stage'),notes=document.getElementById('notes');
function renderIndexOnce(){
  idx.innerHTML=`<h2 class="idx-title">Telas</h2>`+Object.entries(GROUP_LABEL).map(([k,l])=>`<div class="idx-group"><h2>${l}</h2><div class="idx-items">${SCREENS.filter(s=>s.group===k).map(s=>`<button class="idx-item" data-act="idx" data-arg="${s.id}">${esc(s.title)}</button>`).join('')}</div></div>`).join('');
}
function render(){
  idx.querySelectorAll('.idx-item').forEach(b=>{if(b.dataset.arg===S.screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  stage.innerHTML=phoneHTML();
  const s=SCREEN[S.screen];
  notes.innerHTML=`<p class="eyebrow">${esc(GROUP_LABEL[s.group])}</p><h2 class="notes-title">${esc(s.title)}</h2><p class="refs">${esc(s.refs)}</p><ul class="notes-list">${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
}
function go(id){
  if(!SCREEN[id])id='treino-do-dia';
  S.screen=id;
  if(location.hash.slice(1)!==id){try{history.replaceState(null,'','#'+id);}catch(_){}}
  render();
  const h=stage.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,arg=b.dataset.arg;
  if(act==='go'||act==='idx')go(arg);
  else if(act==='open'){S.selected=arg;go('detalhe');}
  else if(act==='more'){S.pages++;render();}
  else if(act==='retry')render();
  else if(act==='reset'){S=freshState();['opt-offline','opt-empty','opt-loading','opt-dark'].forEach(i=>{document.getElementById(i).checked=false;});document.documentElement.removeAttribute('data-theme');go('treino-do-dia');}
});
document.getElementById('opt-offline').addEventListener('change',e=>{S.online=!e.target.checked;render();});
document.getElementById('opt-empty').addEventListener('change',e=>{S.empty=e.target.checked;S.pages=1;render();});
document.getElementById('opt-loading').addEventListener('change',e=>{S.loading=e.target.checked;render();});
document.getElementById('opt-dark').addEventListener('change',e=>{document.documentElement.setAttribute('data-theme',e.target.checked?'dark':'light');});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.screen&&SCREEN[h])go(h);});

renderIndexOnce();
const h0=location.hash.slice(1);
go(SCREEN[h0]?h0:'treino-do-dia');
})();
</script>
