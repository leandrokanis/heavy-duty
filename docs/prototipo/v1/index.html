<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo do Heavy Duty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: índice de telas à esquerda, aparelho (celular ou janela do Mac) no centro, notas da tela e simulação à direita. Tokens seguem DESIGN.md. */
:root{
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --page:#E9ECF2; --panel:#FFFFFF; --fg:#12151C; --fg-2:#596173; --line:#D8DCE4;
  --fill:rgba(118,124,140,.14); --fill-strong:rgba(118,124,140,.28);
  --accent:#2F55E4; --accent-fg:#FFFFFF; --accent-soft:rgba(47,85,228,.12);
  --success:#1E8A4C; --warning:#A86200; --danger:#C9302C; --danger-fg:#FFFFFF;
  --win-open:#0A8EA0; --win-rest:#AEB4C0; --win-cool:#6576A0;
  --app-bg:#F2F3F7; --app-card:#FFFFFF; --frame:#1A1D24; --side-bg:#F5F6F9;
  --glass-fill:rgba(252,252,254,.74); --glass-line:rgba(255,255,255,.7); --sheet-fill:rgba(255,255,255,.92);
  --shadow:0 10px 30px rgba(20,24,40,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0D12; --panel:#151922; --fg:#F1F3F8; --fg-2:#9EA6B6; --line:#272C37;
  --fill:rgba(140,148,166,.16); --fill-strong:rgba(140,148,166,.30);
  --accent:#7B96FF; --accent-fg:#0A0F22; --accent-soft:rgba(123,150,255,.16);
  --success:#41C47F; --warning:#F0A63A; --danger:#FF6B62; --danger-fg:#1B0605;
  --win-open:#2BC4D8; --win-rest:#545C6B; --win-cool:#8E9CC2;
  --app-bg:#06070A; --app-card:#171A22; --frame:#2A2E37; --side-bg:#12151C;
  --glass-fill:rgba(34,37,46,.72); --glass-line:rgba(255,255,255,.10); --sheet-fill:rgba(28,31,40,.95);
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0B0D12; --panel:#151922; --fg:#F1F3F8; --fg-2:#9EA6B6; --line:#272C37;
  --fill:rgba(140,148,166,.16); --fill-strong:rgba(140,148,166,.30);
  --accent:#7B96FF; --accent-fg:#0A0F22; --accent-soft:rgba(123,150,255,.16);
  --success:#41C47F; --warning:#F0A63A; --danger:#FF6B62; --danger-fg:#1B0605;
  --win-open:#2BC4D8; --win-rest:#545C6B; --win-cool:#8E9CC2;
  --app-bg:#06070A; --app-card:#171A22; --frame:#2A2E37; --side-bg:#12151C;
  --glass-fill:rgba(34,37,46,.72); --glass-line:rgba(255,255,255,.10); --sheet-fill:rgba(28,31,40,.95);
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
button{font:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{max-width:1480px;margin:0 auto;display:grid;gap:20px}
.top h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--fg-2);max-width:72ch}
.workspace{display:grid;gap:24px;grid-template-columns:240px minmax(0,1fr) 300px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.idx,.side{position:sticky;top:16px}
.idx-title{font-size:.9375rem;margin:2px 8px 0}
.idx-group h2{font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:16px 8px 4px;font-weight:700}
.idx-items{display:grid;gap:2px}
.idx-item{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:12px;text-align:left;cursor:pointer}
.idx-item:hover{background:var(--fill)}
.idx-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side{display:grid;gap:16px}
.notes-title{font-size:1.125rem;margin:4px 0 2px}
.eyebrow{display:block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:0}
.refs{font-family:var(--mono);font-size:.75rem;color:var(--fg-2);margin:0 0 10px}
.notes-list{margin:0;padding-left:18px;display:grid;gap:8px}
.sim h2{font-size:.9375rem;margin:0 0 4px}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--fill-strong);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.sim-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sim .btn{font-size:.875rem;padding:0 12px}
@media (max-width:1180px){
  .workspace{grid-template-columns:minmax(0,1fr)}
  .idx,.side{position:static}
  .idx-items{display:flex;flex-wrap:wrap;gap:6px}
  .idx-item{width:auto;background:var(--fill)}
}

/* Celular */
.stage{display:flex;justify-content:center;min-width:0}
.phone{width:390px;max-width:100%;height:812px;padding:11px;border-radius:58px;background:var(--frame);box-shadow:var(--shadow)}
.screen{position:relative;height:100%;border-radius:47px;overflow:hidden;background:var(--app-bg);display:flex;flex-direction:column;isolation:isolate}
.status{height:48px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.status-r{display:flex;gap:6px;align-items:center}
.sig{display:flex;gap:2px;align-items:flex-end;height:11px}
.sig i{width:3px;background:currentColor;border-radius:1px}
.batt{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px}
.batt i{display:block;height:100%;width:70%;background:currentColor;border-radius:1.5px}
.nosig{font-size:12px;color:var(--fg-2)}
.screen-body{flex:1;min-height:0;display:flex;flex-direction:column}
.app-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 40px;scrollbar-width:none}
.has-tabs .app-scroll{padding-bottom:116px}
.home-ind{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);opacity:.8;z-index:70;pointer-events:none}
@media (max-width:440px){.phone{padding:6px;border-radius:44px;height:760px}.screen{border-radius:38px}}

.large-head{padding:8px 0 12px}
.large-title{font-size:2.125rem;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.sub{color:var(--fg-2);margin:2px 0 0;font-size:.9375rem}
.sec-title{font-size:.8125rem;font-weight:600;color:var(--fg-2);margin:22px 4px 8px;text-transform:uppercase;letter-spacing:.04em}
.group-box{background:var(--app-card);border-radius:22px;overflow:hidden}
.group-box.pad{padding:12px 16px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 16px;background:none;border:0;text-align:left;cursor:pointer;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:74px;right:0;border-top:1px solid var(--line)}
.g-row + .g-row::before{left:66px}
.row:active{background:var(--fill)}
.letter{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill);font-weight:700;font-size:1.125rem;flex:none}
.row-main{flex:1;min-width:0;display:grid;gap:2px}
.row-title{font-weight:600;font-size:1.0625rem}
.row-meta{color:var(--fg-2);font-size:.875rem}
.chev{color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--fill);font-size:.8125rem;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-open.dot,.sw.st-open{background:var(--win-open)}
.st-rest.dot,.sw.st-rest{background:var(--win-rest)}
.st-cool.dot,.sw.st-cool{background:repeating-linear-gradient(45deg,var(--win-cool) 0 2px,color-mix(in srgb,var(--win-cool) 35%,transparent) 2px 5px)}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.suggest{display:grid;gap:4px;width:100%;text-align:left;border:0;background:var(--app-card);border-radius:22px;padding:16px;margin-top:4px;cursor:pointer}
.suggest:active{background:var(--fill)}
.sug-title{font-size:1.25rem;font-weight:700}
.home-head{display:flex;justify-content:space-between;align-items:center}
.lvl-chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 8px;border:0;border-radius:999px;background:var(--app-card);font-weight:800;font-size:1.125rem;font-variant-numeric:tabular-nums;cursor:pointer}
.lvl-chip .lv-badge{width:28px;height:28px}
.lvl-chip small{font-size:.8125rem;font-weight:700;color:var(--fg-2);margin-left:2px}
.lvl-chip:active{background:var(--fill)}
.today{display:grid;gap:16px;padding:18px 16px 16px;border-radius:26px;background:var(--app-card)}
.today-main{display:flex;align-items:center;gap:14px}
.letter.big{width:56px;height:56px;font-size:1.5rem}
.today-txt{min-width:0;display:grid;gap:2px}
.today-txt h3{margin:0;font-size:1.375rem;letter-spacing:-.01em}
.today .gchips{margin-top:4px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;padding:12px 4px;border-radius:22px;background:var(--app-card)}
.st-i{display:grid;justify-items:center;gap:2px;text-align:center}
.st-i + .st-i{border-left:1px solid var(--line)}
.st-i .gi{width:22px;height:22px}
.st-i b{font-size:1.125rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.st-i small{font-size:.75rem;color:var(--fg-2);font-weight:600}
.wring.sm{width:22px;height:22px}
.wring.sm circle{stroke-width:4}
.row-tail{display:flex;align-items:center;gap:6px;flex:none}
.ml-row{align-items:flex-start}
.ml-row + .ml-row::before{left:68px}
.ml-top{display:flex;justify-content:space-between;font-size:.875rem;color:var(--fg-2)}
.ml-top strong{color:var(--fg)}
.ml-subj{font-size:.9375rem}
.ml-back{display:inline-flex;align-items:center;gap:2px;margin:4px 0 8px -6px}
.ic.flip{transform:scaleX(-1)}
.ml-mail{display:grid;gap:16px;background:var(--app-card);border-radius:22px;padding:18px 16px}
.ml-head{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ml-head div{display:grid;font-size:.875rem}
.ml-head span{color:var(--fg-2)}
.ml-title{font-size:1.375rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ml-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--app-bg)}
.ml-card div{flex:1;display:grid}
.ml-card span{color:var(--fg-2);font-size:.875rem}
.ml-card .gi{width:28px;height:28px}
.ml-card .x2{color:#fff;font-size:.75rem}
.ml-drop{display:flex;align-items:center;gap:8px}
.ml-drop .lv-badge{width:46px;height:46px}
.ml-stats{margin:0;background:var(--app-bg)}
.ml-list{display:grid;gap:10px}
.ml-cta{text-decoration:none}
.ml-foot{display:grid;gap:2px;text-align:center;font-size:.8125rem;color:var(--fg-2);padding-top:12px;border-top:1px solid var(--line)}
.ml-link{border:0;background:none;color:var(--accent);font-weight:600;min-height:44px;cursor:pointer;font-size:.875rem}
.rest-i{color:var(--fg-2)}
.row-meta .meta-i{white-space:nowrap}
.sug-text{color:var(--fg-2)}
.sug-cta{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;margin-top:6px}
.pill{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.875rem;margin:4px 0 8px;background:color-mix(in srgb,var(--warning) 14%,transparent)}
.pill .ic{color:var(--warning);width:18px;height:18px}

.flow-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;min-height:48px;flex:none}
.link-btn{background:none;border:0;color:var(--accent);font-weight:600;min-height:44px;padding:0 10px;justify-self:start;cursor:pointer}
.flow-pos{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px 4px 6px;border:0;border-radius:999px;background:none;cursor:pointer;grid-column:2}
.flow-pos:active{background:var(--fill)}
.flow-pos .ic{width:18px;height:18px;color:var(--fg-2)}
.seg-prog i.cur{box-shadow:inset 0 0 0 1.5px var(--fg)}
.seg-prog i.sk{background:repeating-linear-gradient(45deg,var(--fill-strong) 0 3px,transparent 3px 6px)}
.sq-list{display:grid;margin:6px 0 4px}
.sq-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.sq-row:first-child{border-top:0}
.sq-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 0;border:0;background:none;text-align:left;cursor:pointer}
div.sq-main{cursor:default}
.sq-st{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 2px var(--fill-strong);color:var(--fg-2)}
.sq-st.done{background:var(--fg);color:var(--app-bg);box-shadow:none}
.sq-st.done .ic{width:18px;height:18px;stroke-width:2.6}
.sq-st.now{box-shadow:inset 0 0 0 3px var(--fg);color:var(--fg)}
.sq-st.sk .ic{width:18px;height:18px}
.sq-txt{flex:1;min-width:0;display:grid;gap:4px}
.sq-txt strong{font-size:1rem}
.sq-sub{color:var(--fg-2);font-size:.875rem;font-variant-numeric:tabular-nums}
.sq-row.is-now{background:var(--fill);margin:0 -12px;padding:0 12px;border-radius:16px;border-top-color:transparent}
.sq-row.is-now + .sq-row{border-top-color:transparent}
.sq-row.is-sk strong{color:var(--fg-2)}
.sq-skip{min-height:44px;padding:0 16px;flex:none}
.sheet-actions .btn-end{color:var(--danger)}
.exec{align-items:center;gap:14px;justify-content:flex-start}
.exec .ring-wrap{margin:auto 0}
.exec .ex-head{align-self:stretch}
.exec .ring-fg{stroke:var(--success)}
.exec.pre .ring-fg{stroke:var(--fill-strong)}
.exec.ending .ring-fg{stroke:var(--warning)}
.exec .rest-num{font-size:4rem}
.cd-num{font-size:7rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;animation:cd-pop .9s ease-out both}
@keyframes cd-pop{0%{transform:scale(1.5);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.85}}
.exec.ending .rest-num{color:var(--warning)}
.exec-target{color:var(--fg-2);font-weight:700;font-variant-numeric:tabular-nums}
.flow-actions.two{grid-template-columns:1fr 2fr}
.flow-actions.two .btn{min-height:64px}
.letter.sm{width:30px;height:30px;font-size:.9375rem}
.seg-prog{display:flex;gap:4px;width:132px}
.seg-prog i{flex:1;height:6px;border-radius:3px;background:var(--fill-strong);overflow:hidden}
.seg-prog b{display:block;height:100%;background:var(--fg);border-radius:3px}
.pips{display:inline-flex;gap:6px;align-items:center}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--fill-strong)}
.pips i.done{background:var(--fg)}
.pips i.cur{background:none;box-shadow:inset 0 0 0 2px var(--fg)}
.pips.sm i{width:9px;height:9px}
.pips.lg{gap:8px}
.pips.lg i{width:40px;height:40px;display:grid;place-items:center;font-style:normal;font-size:1.0625rem;font-weight:700;font-variant-numeric:tabular-nums;background:none;box-shadow:inset 0 0 0 2px var(--fill-strong);color:var(--fg-2)}
.pips.lg i.done{background:var(--fg);box-shadow:none;color:var(--app-bg)}
.pips.lg i.done .ic{width:20px;height:20px;stroke-width:2.6}
.pips.lg i.cur{background:var(--app-card);box-shadow:inset 0 0 0 3px var(--fg);color:var(--fg)}
.set-row{margin-bottom:10px}
.flow-body.set-body{gap:32px;padding-top:28px}
.flow-body.set-body .adjs{gap:16px}
.set-head{display:grid;justify-items:center;text-align:center;gap:14px}
.set-head .set-row{margin:0}
.set-head .ex-name{margin:0}
.set-head .chips,.set-head .gchips{justify-content:center;margin:0}
.pips.sm{gap:4px}
.flow-net{justify-self:end;padding-right:8px}
.net{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,transparent)}
.net .ic{width:18px;height:18px}
.flow-body{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px}
.ex-name{font-size:1.75rem;font-weight:700;letter-spacing:-.015em;margin:4px 0 0;line-height:1.15;text-wrap:balance}
.adjs{display:grid;gap:12px}
.adj{background:var(--app-card);border-radius:24px;padding:10px 12px 12px}
.sheet .adj{background:var(--fill)}
.adj-label{font-size:.8125rem;font-weight:600;color:var(--fg-2);text-align:center;margin-bottom:4px}
.adj-row{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px}
.step{width:56px;height:56px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease}
.step:active{background:var(--fill-strong);transform:scale(.94)}
.step.sm{width:44px;height:44px}
.adj-value{position:relative;height:104px;overflow:hidden;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:16px;-webkit-mask-image:linear-gradient(rgba(0,0,0,.3),#000 32%,#000 68%,rgba(0,0,0,.3));mask-image:linear-gradient(rgba(0,0,0,.3),#000 32%,#000 68%,rgba(0,0,0,.3))}
.wheel{display:grid;grid-template-rows:22px 60px 22px;justify-items:center;align-items:center;transition:transform .15s ease}
.adj-value.dragging .wheel{transition:none}
.cur{display:flex;align-items:baseline;justify-content:center;gap:6px}
.nb{font-size:1.25rem;font-weight:600;color:var(--fg-2);opacity:.6;font-variant-numeric:tabular-nums;line-height:1}
.adj-value.dragging{background:var(--accent-soft)}
.num{font-size:3.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.unit{font-size:1.125rem;font-weight:600;color:var(--fg-2)}
.flow-actions{flex:none;padding:12px 16px 30px;display:grid;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--fill);font-weight:600;cursor:pointer;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:active{filter:brightness(.9)}
.btn-danger{background:var(--danger);color:var(--danger-fg)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-xl{min-height:64px;font-size:1.1875rem;width:100%}
.btn-tall{min-height:52px;width:100%}
.mt{margin-top:20px}

.rest{align-items:center;justify-content:center}
.ring-wrap{position:relative;width:240px;height:240px;max-width:100%}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--fill);stroke-width:14}
.ring-fg{fill:none;stroke:var(--fg);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.rest-num{font-size:3.75rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.logged{display:flex;gap:12px;align-items:center;min-height:56px;padding:0 16px 0 12px;border:0;border-radius:999px;background:var(--app-card);cursor:pointer}
.logged:active{background:var(--fill-strong)}
.logged-val{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.logged-edit{color:var(--fg-2);width:20px;height:20px}
.rest-sets{display:flex;justify-content:center}
.up-next{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:32px;color:var(--fg-2);font-weight:600}
.up-name{color:var(--fg);font-size:1rem}
.up-next .ic{width:18px;height:18px;flex:none}
.up-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.set-chips{display:flex;flex-wrap:wrap;gap:6px}
.set-chip{padding:4px 10px;border-radius:999px;background:var(--fill);font-size:.875rem;font-weight:600;font-variant-numeric:tabular-nums}
.meta-i{display:inline-flex;align-items:center;gap:4px}
.meta-i .ic{width:15px;height:15px}
.row-meta{display:flex;gap:12px}
.win-ok{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.win-ok .ic{width:18px;height:18px}
.logged-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.logged-ic .ic{width:18px;height:18px}
.ok-bg{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.wait-bg{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}

.done-head{display:grid;justify-items:center;text-align:center;padding:16px 0 8px;gap:6px}
.done-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.done-ic .ic{width:32px;height:32px;stroke-width:2.2}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--app-card);border-radius:20px;padding:14px 16px;display:grid}
.stat-num{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-lbl{color:var(--fg-2)}
.vol-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:8px 0}
.vol-row .bar{grid-column:1/-1}
.vol-num{font-variant-numeric:tabular-nums;font-weight:600}
.bar{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:inherit}
.bar.big{height:10px;border-radius:5px;margin:4px 0 6px}
.foot-note{color:var(--fg-2);font-size:.8125rem;margin:6px 0 2px}
.empty{color:var(--fg-2);margin:0;padding:14px 16px}
.sum-row{padding:12px 16px;display:grid;gap:8px}
.sum-row + .sum-row{border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--fg-2)}
.kv strong{text-align:right;font-weight:600}

.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 24px 60px}
.login .btn-xl{margin-top:28px}
.empty-sel{color:var(--fg-2);text-align:center;padding-top:96px}
.app-glyph{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--fg);color:var(--app-bg);flex:none}
.app-glyph.big{width:84px;height:84px;border-radius:22px}
.app-glyph.big .ic{width:44px;height:44px}

.map-card{background:var(--app-card);border-radius:22px;padding:14px 12px 12px;margin-bottom:16px}
.map-svg{display:block;width:100%;height:auto;max-height:290px}
.part{cursor:pointer;stroke:var(--app-card);stroke-width:2}
.part.st-open{fill:var(--win-open)}
.part.st-rest{fill:var(--win-rest)}
.part.st-cool{fill:url(#hatch)}
.part.sel{stroke:var(--fg);stroke-width:3}
.part-n{fill:var(--fill-strong)}
.hatch-bg{fill:var(--win-cool);opacity:.35}
.hatch-ln{stroke:var(--win-cool);stroke-width:3}
.map-lbl{fill:var(--fg-2);font-size:12px;font-family:var(--font);font-weight:600}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;list-style:none;margin:8px 0 0;padding:0;font-size:.8125rem;color:var(--fg-2)}
.legend li{display:flex;align-items:center;gap:6px}
.g-row .bar{margin-top:6px}

.period-card{display:flex;gap:16px;align-items:center;background:var(--app-card);border-radius:22px;padding:16px}
.pring{width:96px;height:96px;transform:rotate(-90deg);flex:none}
.pring circle{fill:none;stroke-width:10}
.pring .bg{stroke:var(--fill)}
.pring .fg{stroke:var(--fg);stroke-linecap:round}
.p-num{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.p-num small{font-size:1rem;color:var(--fg-2);font-weight:600}
.intent{margin:6px 0 0;font-weight:600}
.ind{display:grid;gap:6px;padding:8px 0}
.ind + .ind{border-top:1px solid var(--line);padding-top:14px}
.ind-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ind-val{font-size:1.375rem;font-weight:700;font-variant-numeric:tabular-nums}
.ind-goal{color:var(--fg-2);font-size:.8125rem}
.empty-card{background:var(--app-card);border-radius:22px;padding:22px 18px;text-align:center;color:var(--fg-2);display:grid;justify-items:center;gap:4px}
.empty-card p{margin:0}
.empty-card strong{color:var(--fg)}

.glass{background:var(--glass-fill);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--glass-line);box-shadow:0 8px 28px rgba(15,20,35,.16)}
.tabbar{position:absolute;left:16px;right:16px;bottom:24px;height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:26px;font-size:.6875rem;font-weight:600;color:var(--fg-2);cursor:pointer}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.backdrop{position:absolute;inset:0;background:rgba(8,10,16,.32);display:flex;align-items:flex-end;z-index:40;padding:8px}
.sheet{width:100%;max-height:88%;overflow-y:auto;border-radius:39px;padding:8px 20px 26px;background:var(--sheet-fill)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill-strong);margin:4px auto 12px}
.sheet-title{font-size:1.375rem;font-weight:700;margin:0 0 4px}
.sheet-text{color:var(--fg-2);margin:8px 0 14px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sheet-actions .btn{min-height:52px}
.ss-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.ss-meta{display:flex;gap:14px;color:var(--fg-2);font-size:.9375rem;font-weight:600;margin-top:2px}
.ss-list{list-style:none;margin:10px 0 0;padding:0;display:grid}
.ss-list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ss-list span{color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.end-prog{display:grid;gap:8px;margin:12px 0 4px}
.end-prog .seg-prog{width:100%}
.end-prog .seg-prog i{height:10px;border-radius:5px}
.end-nums{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.end-nums .xp-total .gi{width:20px;height:20px}
.state-line{display:flex;align-items:center;gap:8px;margin:4px 0 12px;font-weight:600}
.banner{position:absolute;top:52px;left:8px;right:8px;z-index:50;border-radius:28px;display:flex;align-items:center;padding:4px 4px 4px 0}
.banner-main{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:none;border:0;text-align:left;padding:8px 4px 8px 12px;min-height:56px;cursor:pointer}
.banner-txt{display:grid;gap:1px;font-size:.875rem;flex:1;min-width:0}
.banner-time{font-size:.75rem;color:var(--fg-2);align-self:flex-start;margin-top:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg-2);flex:none}
.toast-host{position:absolute;left:16px;right:16px;bottom:108px;display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast{padding:10px 16px;border-radius:999px;font-weight:600;font-size:.875rem;text-align:center;max-width:100%}

/* Mac */
.stage-mac{justify-content:flex-start}
.mac-scroll{overflow-x:auto;max-width:100%;padding-bottom:8px;width:100%}
.mac{width:1040px;height:660px;display:grid;grid-template-columns:232px minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--app-card);box-shadow:var(--shadow);position:relative;margin:0 auto}
.mac-side{background:var(--side-bg);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.dots{display:flex;gap:8px;padding:4px 8px 16px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--fill-strong)}
.side-label{font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);margin:6px 10px}
.side-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer}
.side-item:hover{background:var(--fill)}
.side-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:.8125rem;display:grid;gap:4px}
.side-foot p{margin:0;color:var(--fg-2)}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.status-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success)}
.mac-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.mac-toolbar{height:60px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px 0 24px;border:0;border-bottom:1px solid var(--line);box-shadow:none}
.mac-toolbar h2{font-size:1.125rem;margin:0}
.tb-actions{display:flex;gap:8px}
.mac-content{flex:1;min-height:0;overflow:auto;padding:20px 24px 32px}
.lead{color:var(--fg-2);margin:0 0 12px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.table{width:100%;border-collapse:collapse;font-size:.875rem}
.table th{text-align:left;font-size:.6875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2);padding:10px 14px;border-bottom:1px solid var(--line);background:var(--side-bg)}
.table td{padding:6px 14px;height:52px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.strong{font-weight:600}
.num-cell{font-variant-numeric:tabular-nums}
.mini-step{display:flex;align-items:center;gap:6px}
.mini-step .w{min-width:70px;text-align:center;font-weight:600}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px;margin-bottom:16px}
.seg-btn{min-height:44px;padding:0 16px;border:0;border-radius:999px;background:none;font-weight:600;cursor:pointer;color:var(--fg-2)}
.seg-btn[aria-selected="true"]{background:var(--app-card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.prog-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.prog-head h3{margin:2px 0 0;font-size:1.5rem}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--success) 12%,transparent);margin-bottom:14px}
.notice .ic{color:var(--success)}
.group-sec{margin-bottom:18px}
.group-sec h3{font-size:.9375rem;margin:0 0 8px}
.mu-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mu-row{display:flex;align-items:center;min-height:44px;padding:0 14px}
.mu-row + .mu-row{border-top:1px solid var(--line)}
.hist{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.hist-list{display:grid;gap:6px}
.hist-item{display:grid;gap:2px;text-align:left;padding:10px 14px;min-height:60px;border-radius:14px;border:1px solid var(--line);background:none;cursor:pointer}
.hist-item:hover{background:var(--fill)}
.hist-item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.hist-item .sub{font-size:.8125rem}
.hist-detail{border:1px solid var(--line);border-radius:14px;padding:16px}
.hist-detail h3{margin:0 0 2px;font-size:1.125rem}
.hist-detail .table-wrap{margin-top:12px}
.sys-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sys-card{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px}
.ok-text,.fail-text{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.ok-text{color:var(--success)}
.fail-text{color:var(--danger)}
.ok-text .ic,.fail-text .ic{width:18px;height:18px}
.mac-backdrop{position:absolute;inset:0;background:rgba(8,10,16,.3);display:flex;justify-content:center;align-items:flex-start;padding-top:64px;z-index:40}
.mac-sheet{width:470px;max-height:560px;overflow:auto;background:var(--app-card);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.mac-sheet h3{margin:0 0 14px;font-size:1.125rem}
.field{display:grid;gap:6px;margin:0 0 14px;border:0;padding:0;min-width:0}
.field label,.field legend{font-weight:600;font-size:.875rem;padding:0}
.field input[type=text],.field select{min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;background:var(--app-bg);color:var(--fg);font:inherit}
.radios,.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.radios label,.checks label{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.checks .sub{font-size:.75rem;margin:0}
input[type=radio],input[type=checkbox]:not(.switch){width:20px;height:20px;accent-color:var(--accent);margin:0}
.form-error{color:var(--danger);font-weight:600;min-height:1.4em;margin:0}
.mac-toast{bottom:24px}

/* Gamificação (ondas 5 a 7): cores, ícones e animações só dos elementos de jogo */
:root{--game-xp:#6D3EF0;--game-xp-2:#D63AA8;--game-gold:#E8A800;--game-gold-2:#FFD34D;--game-record:#D1246E;--game-flame:#F2542D;--game-flame-2:#FFB020;--game-x2:var(--win-open)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--game-xp:#A78BFA;--game-xp-2:#F472B6;--game-record:#FF5FA2}}
:root[data-theme="dark"]{--game-xp:#A78BFA;--game-xp-2:#F472B6;--game-record:#FF5FA2}
.gi{width:22px;height:22px;flex:none}
.gi-bolt{fill:url(#gg-xp)}.gi-shield{fill:url(#gg-xp)}.gi-medal,.gi-trophy,.gi-star{fill:url(#gg-gold)}.gi-flame{fill:url(#gg-flame)}.gi-sparkle{fill:var(--game-record)}.gi-target{fill:var(--game-x2)}.gi-question{fill:var(--fill-strong)}
.g-grad{background:linear-gradient(90deg,var(--game-xp),var(--game-xp-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.x2{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 6px;border-radius:999px;background:var(--game-x2);color:#fff;font-size:.75rem;font-weight:800;letter-spacing:.02em}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gchip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--fill);font-size:.8125rem;font-weight:700;min-height:28px}
.gchip.st-open{background:color-mix(in srgb,var(--game-x2) 16%,transparent)}
.gchip.st-cool.has-x2{background:color-mix(in srgb,var(--game-xp) 12%,transparent)}
.gchip:not(.has-x2){padding-right:10px}
.rec-mark{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:1px 8px 1px 4px;border-radius:999px;background:var(--fill);color:var(--fg-2);font-variant-numeric:tabular-nums;vertical-align:middle;transition:background .2s,color .2s}
.rec-mark .gi{width:14px;height:14px}
.rec-mark.hit{background:var(--game-record);color:#fff;animation:g-pop .45s cubic-bezier(.2,1.6,.4,1)}
.rec-mark.hit .gi{fill:#fff}
.rest.game{gap:14px;justify-content:flex-start;padding-top:4px}
.rest.game .ring-wrap{width:168px;height:168px}
.rest.game .rest-num{font-size:2.75rem}
.rest.game .pips.lg i{width:34px;height:34px;font-size:.9375rem}
.logged .rec-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 4px;border-radius:999px;background:var(--game-record);color:#fff;font-size:.75rem;font-weight:800}
.logged .rec-pill .gi{width:14px;height:14px;fill:#fff}
.logged.rec{box-shadow:0 0 0 2px var(--game-record),0 6px 24px color-mix(in srgb,var(--game-record) 35%,transparent)}
.xp-panel{width:100%;background:var(--app-card);border-radius:22px;padding:12px 14px;display:grid;gap:10px}
.xp-total{display:flex;align-items:center;gap:8px}
.xp-total .gi{width:26px;height:26px}
.xp-num{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-badge{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none}
.lv-badge .gi{position:absolute;inset:0;width:100%;height:100%}
.lv-badge b{position:relative;color:#fff;font-size:.875rem;font-weight:800;font-variant-numeric:tabular-nums}
.lv-badge.t2 b,.lvup-badge.t2 b{margin-top:-2px}
.lv-badge.t4 b{font-size:.8125rem}
.lv-badge.bump{animation:g-pop .5s cubic-bezier(.2,1.6,.4,1)}
.lv-main{flex:1;min-width:0;display:grid;gap:4px}
.lv-top{display:flex;justify-content:space-between;font-weight:700;font-size:.9375rem}
.lv-gain{font-variant-numeric:tabular-nums}
.lv-bar{display:block;height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.lv-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--game-xp),var(--game-xp-2));transition:width .8s cubic-bezier(.3,.9,.3,1)}
.lv-bar.sm{height:6px}
.near{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.near .gi{width:26px;height:26px}
.near-main{flex:1;min-width:0;display:grid;gap:4px;font-size:.8125rem;font-weight:700}
.near-main .lv-bar i{background:linear-gradient(90deg,var(--game-gold),var(--game-gold-2))}
.float-pts{position:absolute;left:0;right:0;bottom:120px;display:flex;justify-content:center;align-items:center;gap:6px;z-index:65;pointer-events:none;animation:g-float 1.2s ease-out forwards}
.float-pts > span:first-child{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
@keyframes g-float{0%{transform:translateY(20px) scale(.6);opacity:0}20%{transform:translateY(0) scale(1.1);opacity:1}70%{opacity:1}100%{transform:translateY(-90px) scale(1);opacity:0}}
@keyframes g-pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:2px;background:var(--c,var(--game-xp));animation:g-burst .9s ease-out forwards;transform:rotate(var(--a)) translateY(0)}
@keyframes g-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(var(--d,-120px)) scale(.4);opacity:0}}
.lvup{position:absolute;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:4px;text-align:center;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--game-xp) 55%,var(--app-bg)) 0%,color-mix(in srgb,var(--game-xp-2) 30%,var(--app-bg)) 45%,var(--app-bg) 80%);animation:g-fade .25s ease-out;cursor:pointer;border:0;color:var(--fg);width:100%}
.lvup-badge{position:relative;width:132px;height:132px;display:grid;place-items:center;animation:g-pop .6s cubic-bezier(.2,1.6,.4,1)}
.lvup-badge .gi{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 10px 30px color-mix(in srgb,var(--game-xp) 60%,transparent))}
.lvup-badge b{position:relative;color:#fff;font-size:3.25rem;font-weight:900}

<script>
(function(){
const TODAY='2026-11-20';
const GROUPS={peito:'Peito',costas:'Costas',lombar:'Lombar',ombros:'Ombros',biceps:'Bíceps',triceps:'Tríceps',abdomen:'Abdômen',quadriceps:'Quadríceps',posteriores:'Posteriores de coxa',gluteos:'Glúteos',panturrilhas:'Panturrilhas'};
const WINDOWS={
  peito:{state:'open',label:'Janela aberta',detail:'fecha amanhã às 18h',progress:.62},
  triceps:{state:'open',label:'Janela aberta',detail:'fecha amanhã às 18h',progress:.48},
  abdomen:{state:'open',label:'Janela aberta',detail:'fecha hoje às 21h',progress:.35},
  ombros:{state:'rest',label:'Descansando',detail:'abre amanhã às 7h',progress:.40},
  costas:{state:'rest',label:'Descansando',detail:'abre amanhã às 9h',progress:.55},
  biceps:{state:'rest',label:'Descansando',detail:'abre amanhã às 9h',progress:.50},
  lombar:{state:'rest',label:'Descansando',detail:'abre amanhã às 9h',progress:.30},
  quadriceps:{state:'cool',label:'Esfriando',detail:'a janela passou há 2 dias',progress:.30},
  gluteos:{state:'cool',label:'Esfriando',detail:'a janela passou há 2 dias',progress:.28},
  posteriores:{state:'cool',label:'Esfriando',detail:'a janela passou há 2 dias',progress:.20},
  panturrilhas:{state:'rest',label:'Fora do programa',detail:'',progress:0}
};
const WINDOWS0=JSON.parse(JSON.stringify(WINDOWS));
const STEP={loadKg:2.5,reps:1,seconds:5};
const MIN={loadKg:0,reps:1,seconds:5};
const FLOW_IDS=['serie','descanso','correcao','sequencia','fim'];
const GROUP_LABEL={mvp:'Celular · MVP (ondas 1 a 4)',full:'Celular · ondas 5 a 7',mac:'Mac · administração depois do MVP'};
const SCREENS=[
  {id:'entrar',group:'mvp',title:'Entrar',refs:'US-F14-01 · NFR02 · H12',notes:['A entrada vem antes de qualquer dado de treino.','O método de autenticação está em aberto (H12). O botão representa o método que for escolhido.','Depois de entrar, o atleta adiciona o app à tela inicial (NFR05).']},
  {id:'treino-do-dia',group:'mvp',title:'Treino do dia',refs:'US-F03-01 · D16',notes:['O atleta escolhe a letra do programa. Uma folha de confirmação mostra o resumo da letra (exercícios, séries, duração estimada) e pede Começar (D25). Depois, o primeiro exercício abre com os valores preenchidos.','No MVP não há sugestão pelas janelas. A sugestão entra na onda 6 (F12).','Sem barra de abas: o MVP tem uma seção só (DESIGN.md, 9.2).']},
  {id:'serie',group:'mvp',title:'Série',refs:'US-F03-01 · US-F03-02 · US-F03-07 · US-F04-01 · O5 · D23 · D27',notes:['Um toque em Próximo registra a série com os valores exibidos e inicia o descanso. Todo botão que avança o treino se chama Próximo.','O número funciona como uma roda: o valor maior fica acima, e arrastar para baixo (ou rolar a roda do mouse para cima) aumenta o valor. Os botões − e + fazem o mesmo por toque (WCAG 2.5.7, DESIGN.md 16.3). A tela não traz texto de instrução: os valores vizinhos da roda e os botões indicam o ajuste.','A carga vem do último treino quando ele existe (H07). A carga não fica abaixo de 0 kg.','Teste o toque duplo em Próximo: o segundo toque é ignorado.','Exercício por tempo (Prancha, na letra A): Próximo inicia uma contagem de 3 segundos, com um bipe por número e um bipe agudo no início. O tempo da execução corre sozinho; os últimos 3 segundos têm bipes e anel laranja, e o fim tem um som descendente que já inicia o descanso. Próximo durante a execução termina antes e registra o tempo feito; Cancelar volta sem registrar (US-F03-07).','Os círculos numerados mostram as séries do exercício: ✓ feita, contorno grosso a atual, contorno fino as que faltam. A cor de destaque fica só para o que é tocável (DESIGN.md).','Com a chave Gamificação ligada na simulação: as etiquetas dos grupos mostram o estado da janela, e ×2 marca pontos em dobro. A marca rosa ao lado de Carga é o recorde do exercício; passe dela com + para ver o recorde acender, com som.']},
  {id:'descanso',group:'mvp',title:'Descanso',refs:'US-F05-01 · US-F03-02 · D23 · Q11',notes:['O descanso vem do programa e corre sozinho. No fim, a próxima série aparece pronta.','Próximo pula o descanso.','O botão Próximo fica no mesmo lugar nas duas telas. Por isso, toques nos primeiros 0,8 s depois de registrar a série são ignorados em silêncio, para um toque duplo não pular o descanso por acidente.','Use Tempo acelerado na simulação para não esperar o tempo real.','Encerrar pede confirmação numa folha com as séries feitas e as que faltam (D25). Com a folha aberta, o descanso continua contando, mas a próxima série espera a folha fechar. Na última série, o treino termina sozinho, sem confirmação.','Com a chave Gamificação ligada na simulação: cada Próximo solta os pontos ganhos, enche a barra de nível dos grupos e, quando a barra completa, mostra a subida de nível em tela cheia por 1,7 s, sem pedir toque. Medalhas novas descem do topo.','Os pontos são relativos ao plano: a série que bate o planejado vale 10, em dobro dentro da janela. Cada grupo recebe o mesmo total por treino completo, não importa quantas séries tenha (D28).','O músculo secundário conta metade: no supino, peito recebe os pontos cheios, e tríceps e ombros recebem metade (proposta para a Q08).','Nível de 1 a 20. Aproveitando todas as janelas, o grupo chega ao 20 em cerca de 4 semanas. Níveis comuns sobem na própria barra; a tela cheia fica para as faixas (5, 11, 17) e o 20. Os números são parâmetros (Q11).']},
  {id:'correcao',group:'mvp',title:'Correção da última série',refs:'US-F04-02 · R06',notes:['Corrige a última série registrada, para desfazer um arrasto errado.','A correção vale para o histórico.','Se o descanso terminar durante a correção, a próxima série espera a folha fechar.']},
  {id:'sequencia',group:'mvp',title:'Sequência do treino',refs:'US-F03-04 · US-F03-05 · US-F03-06 · D26',notes:['O controle no topo (letra e barra de exercícios) abre a sequência do treino.','Um toque num exercício que falta leva a ele: o treino segue fora da ordem, por exemplo quando o equipamento está ocupado. No descanso, o exercício escolhido vira o próximo e o descanso continua.','Pular deixa o exercício de lado; ele fica marcado e pode ser feito depois com um toque. Quando acabam os exercícios, o treino termina, mesmo com exercícios pulados.','Os exercícios feitos mostram as séries registradas.','Encerrar fica no fim da folha, longe do polegar e do canto onde se espera o voltar (D26). Ele abre a confirmação (D25).']},
  {id:'fim',group:'mvp',title:'Treino concluído',refs:'O4 · Q07 · Q08 · D23',notes:['Resumo do treino com o volume por grupo muscular.','Exercício de tempo fica fora do volume até a Q07 ser resolvida.','O volume conta o exercício inteiro em cada grupo ativado. A regra para músculo secundário está em aberto (Q08).','Com a chave Gamificação ligada na simulação: o topo mostra os pontos do treino, a posição no ranking pessoal, os recordes, os níveis ganhos, as medalhas novas e quando cada janela reabre (Octalysis, núcleo 3).','A reabertura usa o volume ajustado: o volume do treino corrigido pela base do objetivo do programa. No exemplo, o objetivo é hipertrofia, com fator 1; força usaria 1,3 e resistência 0,75. Os fatores são ilustrativos.']},
  {id:'sugestao',group:'full',title:'Treino do dia com sugestão',refs:'F12 · H06 · Q06 · D23 · D29 · Q12',notes:['A barra de abas aparece porque a UI passa a ter três seções.','A sugestão segue a recuperação (proposta da Q06): a letra cujos grupos estão na maioria descansando sai da disputa; entre as outras, grupos esfriando pesam mais que grupos em janela, e o grupo mais fraco desempata.','No exemplo, a sugestão é a letra C: quadríceps e glúteos estão esfriando, recuperados e perdendo nível, com ↺ ×2. A letra B aparece com a hora em que a janela abre.','O selo do nível geral leva à letra do grupo mais fraco só se esse grupo estiver em janela ou esfriando. Se ele ainda estiver descansando, o selo abre o detalhe do grupo, com a hora em que a janela abre.','Quando a janela e o plano sugerem letras diferentes, a regra está em aberto (Q06).','Uma ação principal: o cartão Hoje traz a letra sugerida, os grupos que rendem em dobro e o botão Começar.','O nível geral fica no topo: é o nível do grupo mais fraco entre os que o programa treina, com o nome do grupo ao lado (D29). Um toque abre a confirmação da letra que mais treina esse grupo. Abaixo do cartão, uma linha só com sequência de semanas (Q12), meta semanal de janelas e pontos da semana.','Em Outras letras, cada linha mostra só o que pede atenção: ×2 quando há grupo em janela e a seta de queda quando há grupo esfriando (D24), com ↺ ×2 de recuperação.']},
  {id:'mapa',group:'full',title:'Mapa do corpo',refs:'F07 · F08 · F10 · EN01 · D23 · D24 · Q13',notes:['O mapa mostra o estado da janela de cada um dos 11 grupos: aberta, descansando ou esfriando. Na frente: peito, ombros, bíceps, abdômen e quadríceps. Atrás: costas, lombar, tríceps, glúteos, posteriores de coxa e panturrilhas.','Panturrilhas está fora do programa de exemplo: aparece em cinza e não entra no nível geral (D29).','O esfriamento usa hachura além da cor, para não depender só da cor.','Os horários são ilustrativos. O cálculo real sai da EN01, com os dados do MVP.','Cada grupo tem nível de 1 a 20 e barra para o próximo nível. O selo muda de forma e de cor a cada faixa: círculo de bronze (1 a 4), escudo de prata (5 a 10), hexágono de ouro (11 a 16) e estrela violeta (17 a 20). A forma diferencia a faixa sem depender só da cor.','Grupo esfriando perde nível (D24): a barra listrada esvazia desde o fim da janela, o selo perde a cor e a seta mostra quando o grupo cai de nível. Parado, o grupo vai do 20 ao 1 em 4 a 5 semanas: cerca de 40 pontos por dia (Q13).','↺ ×2 é a memória muscular: o grupo abaixo do melhor nível rende pontos em dobro até alcançá-lo.']},
  {id:'grupo',group:'full',title:'Detalhe do grupo',refs:'F07 · F10 · Q04 · D24',notes:['Janela, progresso no período e último treino de um grupo.','Esfriar não tira progresso. O bônus de volta depois de esfriar está em aberto (Q04).']},

function prefill(day,ex){const it=D.program.days[day].items[ex];return {loadKg:it.lastKg??it.loadKg,reps:it.reps??null,seconds:it.seconds??null};}
function startFlow(day){stopTimer();S.gs={points:0,levels:[],medals:[],records:[],x2:false};S.lastGain=null;S.fx=null;S.flow={day,ex:0,set:0,saved:false,skipped:[],target:null};S.current=[];S.values=prefill(day,0);S.phase='set';S.sheet=null;}
function pushSet(){
  const it=item(),e=D.exercises[it.ex];
  const entry={id:++S.seq,exIdx:S.flow.ex,ex:it.ex,kind:e.kind,loadKg:S.values.loadKg,reps:e.kind==='reps'?S.values.reps:null,seconds:e.kind==='time'?S.values.seconds:null,setNo:S.flow.set+1,synced:S.online};
  entry.record=S.full&&isRecord(entry);
  S.current.push(entry);
  if(!S.online) S.pending++;
  S.lastGain=award(entry);
  return entry;
}
function logSet(){const e=pushSet();S.fx=S.lastGain;startRest(item().restSeconds);announce(`Série ${e.setNo} registrada: ${setText(e)}.`);return e;}
function startRest(sec){S.phase='rest';S.restTotal=sec;S.restLeft=sec;stopTimer();resumeRest();}
function resumeRest(){if(S.timer||S.phase!=='rest')return;S.timer=setInterval(tick,S.fast?100:1000);}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function tick(){
  S.restLeft=Math.max(0,S.restLeft-1);
  if(S.restLeft>0||S.sheet==='correcao'||S.sheet==='end'||S.sheet==='seq'){updateTimer();return;}
  advance();announce('Descanso terminado.');go(S.screen);
}
const dayItems=()=>D.program.days[S.flow.day].items;
function doneCount(i){return S.current.filter(c=>c.exIdx===i).length;}
function isComplete(i){return doneCount(i)>=dayItems()[i].sets;}
function nextIndex(from){const n=dayItems().length;for(let k=1;k<=n;k++){const i=(from+k)%n;if(!isComplete(i)&&!S.flow.skipped.includes(i))return i;}return -1;}
function afterSet(){const c=S.flow.ex;if(S.flow.target!=null)return S.flow.target;return isComplete(c)||S.flow.skipped.includes(c)?nextIndex(c):c;}
function upcoming(){return S.phase==='rest'?afterSet():S.flow.ex;}
function valuesFor(i){const l=[...S.current].reverse().find(c=>c.exIdx===i);return l?{loadKg:l.loadKg,reps:l.reps,seconds:l.seconds}:prefill(S.flow.day,i);}
function switchTo(i){S.flow.ex=i;S.flow.set=doneCount(i);S.values=valuesFor(i);S.flow.target=null;S.flow.skipped=S.flow.skipped.filter(x=>x!==i);}
function advance(){
  stopTimer();
  const nx=afterSet();
  if(nx<0){finish();return;}
  if(nx!==S.flow.ex)switchTo(nx);else{S.flow.set=doneCount(nx);S.flow.target=null;}
  S.phase='set';S.screen='serie';S.sheet=null;
}
function finish(){
  stopTimer();S.phase='done';S.screen='fim';S.sheet=null;
  if(S.flow&&!S.flow.saved&&S.current.length){
    S.history.unshift({id:'w'+(++S.seq),date:TODAY,day:S.flow.day,pts:S.full?S.gs.points:undefined,sets:S.current.map(x=>({...x}))});
    S.fxFim=S.full;
    if(S.full)[...new Set(S.current.flatMap(x=>groupsOf(x.ex)))].forEach(g=>{if(WINDOWS[g].state==='cool')WINDOWS[g]={...WINDOWS[g],state:'rest',label:'Descansando',detail:'abre em 2 dias'};});
  }
  if(S.flow) S.flow.saved=true;
}

function dayLoad(k){const w={};D.program.days[k].items.forEach(it=>groupsOf(it.ex).forEach(g=>{w[g]=(w[g]||0)+it.sets;}));return w;}
function dayRecovering(k){const w=dayLoad(k),tot=Object.values(w).reduce((a,b)=>a+b,0),rest=Object.entries(w).filter(([g])=>WINDOWS[g].state==='rest').reduce((a,[,n])=>a+n,0);return rest/tot>.5;}
function dayScore(k){const W={cool:3,open:2,rest:-2};return Object.entries(dayLoad(k)).reduce((a,[g,n])=>a+n*(W[WINDOWS[g].state]??0),0);}
function dayWeakest(k){return Math.min(...dayGroups(k).map(g=>G.lv[g].lvl));}
function bestDay(){const ks=Object.keys(D.program.days),ok=ks.filter(k=>!dayRecovering(k));const pool=ok.length?ok:ks;return pool.sort((a,b)=>dayScore(b)-dayScore(a)||dayWeakest(a)-dayWeakest(b))[0];}
function nextOpen(k){const g=dayGroups(k).find(x=>WINDOWS[x].state==='rest');return g?WINDOWS[g].detail:'';}
function letterRow(k,d,full){

function letterRowGame(k,d){

  return `<button class="row" data-act="start-day" data-arg="${k}" aria-label="Letra ${k}, ${esc(d.label)}"><span class="letter" aria-hidden="true">${k}</span><span class="row-main"><span class="row-title">${esc(d.label)}</span><span class="row-meta"><span class="meta-i">${icon('history')}${last?fmtTiny(last.date):'—'}</span>${tail}</span></span>${icon('chevronR','chev')}</button>`;
}

function execView(){

  return `<div class="flow-body rest exec${pre?' pre':''}${ending?' ending':''}">
    <div class="ex-head set-head"><div class="set-row" role="img" aria-label="Série ${S.flow.set+1} de ${it.sets}">${pips(it.sets,S.flow.set,S.flow.set,'lg')}</div><h2 class="ex-name">${esc(e.name)}</h2></div>

      <div class="ring-center" role="timer" aria-label="${pre?'Contagem para começar':'Tempo de execução'}">${pre?`<span class="cd-num" id="cd-num">${T.left}</span>`:`<span id="exec-num" class="rest-num">${mmss(T.left)}</span><span class="exec-target">${T.total} s</span>`}</div></div>
  </div>
  <div class="flow-actions two"><button class="btn" data-act="exec-cancel">Cancelar</button><button class="btn btn-primary btn-xl" data-act="exec-done"${pre?' disabled':''}>Próximo${icon('chevronR')}</button></div>`;
}
function stopExec(){if(S.execTimer){clearInterval(S.execTimer);S.execTimer=null;}}
function startExec(){
  stopExec();const target=S.values.seconds;
  S.timed={stage:'pre',left:3,total:target};SFX.cd();haptic(10);
  S.execTimer=setInterval(()=>{
    const T=S.timed;if(!T){stopExec();return;}
    T.left--;
    if(T.left>0){SFX.cd();render();return;}
    stopExec();T.stage='run';T.left=T.total;SFX.go();haptic(30);announce('Começou.');render();
    S.execTimer=setInterval(execTick,S.fast?100:1000);
  },1000);
}
function execTick(){
  const T=S.timed;if(!T){stopExec();return;}
  T.left=Math.max(0,T.left-1);
  if(T.left>0){if(T.left<=3){SFX.cdEnd();}if(T.left===3)render();else updateExec();return;}
  SFX.end();haptic([40,60,40]);finishExec(T.total);
}
function updateExec(){
  const T=S.timed,n=document.getElementById('exec-num'),r=document.getElementById('exec-fg');
  if(n)n.textContent=mmss(T.left);if(r){const C=2*Math.PI*104;r.setAttribute('stroke-dashoffset',String(C*(1-T.left/T.total)));}
}
function finishExec(elapsed){
  stopExec();const target=S.timed.total;S.timed=null;
  S.values.seconds=Math.max(MIN.seconds,elapsed);S.lastDone=Date.now();logSet();S.values.seconds=target;go('descanso');
}
function cancelExec(){stopExec();S.timed=null;}

  if(S.fxFim){S.fxFim=false;SFX.fanfare();haptic([20,40,20]);burst(document.querySelector('.win-hero .hero-ic'),['var(--game-xp)','var(--game-xp-2)','var(--game-gold)'],20,-110);
    if(S.gs.medals.length)later(900,SFX.medal);}
}
function rankList(){
  const list=S.history.map(w=>({id:w.id,date:w.date,day:w.day,pts:w.pts??w.sets.length*10}));
  return list.sort((a,b)=>b.pts-a.pts);
}
function rankPos(pts){return rankList().filter(w=>w.pts>pts).length+1;}
const GOAL_FACTOR={forca:1.3,hipertrofia:1,resistencia:.75};
function adjustedVolumeByGroup(sets){const f=GOAL_FACTOR[D.program.goal]??1,v=volumeByGroup(sets);Object.keys(v).forEach(g=>{v[g]*=f;});return v;}
function reopenAt(g,vol){
  const h=40+vol/60,d=new Date(NOW.getTime()+h*3600e3);
  if(d.getHours()<7)d.setHours(7,0,0,0);
  return {h,label:d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')+' '+d.getHours()+'h'};
}
function gameSummary(){
  const gs=S.gs,trained=[...new Set(S.current.flatMap(s=>groupsOf(s.ex)))],vol=adjustedVolumeByGroup(S.current);
  const ups={};gs.levels.forEach(x=>{ups[x.g]=(ups[x.g]||0)+1;});
  const rank=rankPos(gs.points);
  const hero=`<div class="win-hero"><span class="hero-ic">${gi('bolt')}</span><span class="hero-num g-grad">+<span data-count-from="0" data-count-to="${gs.points}">${fmt(gs.points)}</span></span><span class="hero-lbl">pontos</span>
    <div class="hero-chips"><span class="hchip">${gi('trophy')}${rank}º do período</span>${gs.records.length?`<span class="hchip">${gi('sparkle')}${gs.records.length} ${gs.records.length>1?'recordes':'recorde'}</span>`:''}${gs.x2?'<span class="hchip"><span class="x2">×2</span>na janela</span>':''}</div></div>`;
  const lv=`<h3 class="sec-title">Níveis</h3><div class="group-box pad lv-list">${trained.map(g=>{const L=G.lv[g],n=ups[g]||0;return `<div class="lv-row" role="img" aria-label="${GROUPS[g]}, nível ${L.lvl}">${lvBadge(L.lvl,n?'bump':'')}<div class="lv-main"><div class="lv-top"><span>${GROUPS[g]}</span>${n?`<span class="lv-up"><span class="arrow">${L.lvl-n} →</span><span class="g-grad">${L.lvl}</span></span>`:''}</div><span class="lv-bar"><i style="width:${lvPct(L)}%"></i></span></div></div>`;}).join('')}</div>`;
  const md=gs.medals.length?`<h3 class="sec-title">Medalhas novas</h3><div class="medal-cards">${gs.medals.map((m,i)=>`<div class="medal-card new" style="--i:${i}"><span class="medal-ic">${gi(m.icon)}</span>${esc(m.name)}</div>`).join('')}</div>`:'';
  const ro=trained.map(g=>({g,...reopenAt(g,vol[g]||0)}));const maxH=Math.max(...ro.map(r=>r.h),1);
  const reo=`<h3 class="sec-title">Janelas reabrem</h3><div class="group-box pad">${ro.map(r=>`<div class="reopen-row"><span>${GROUPS[r.g]}</span><span class="reopen-bar"><i style="width:${(r.h/maxH*100).toFixed(0)}%"></i></span><b>${r.label}</b></div>`).join('')}</div>`;
  return hero+lv+md+reo;
}
function dropAlert(){
  const g=Object.keys(GROUPS).find(k=>WINDOWS[k].state==='cool');if(!g)return '';
  const L=G.lv[g],dr=dropInfo(g),day=Object.keys(D.program.days).find(k=>dayGroups(k).includes(g));
  return `<button class="drop-alert" data-act="start-day" data-arg="${day}" aria-label="${GROUPS[g]} cai para o nível ${dr.to} em ${dr.days} dias. Treinar a letra ${day}, recuperação em dobro">
    <span class="drop-main"><strong>${GROUPS[g]}</strong><span class="drop-lv">${lvBadge(L.lvl,'cold')}<span class="drop">${icon('arrowDown')}</span>${lvBadge(dr.to,'cold')}<span class="drop">${dr.days} d</span></span></span>
    <span class="letter sm" aria-hidden="true">${day}</span>${isMem(g)?'<span class="x2 mem">↺ ×2</span>':''}${icon('chevronR','chev')}</button>`;
}
function gameStrip(){
  const C=2*Math.PI*12,w=G.week,st=G.streak;
  return `<div class="game-strip">
    <div class="gs-item" role="img" aria-label="Nível ${athleteLevel()} de ${MAX_LVL}"><span class="lv-badge t${tierOf(athleteLevel())}" style="width:28px;height:28px">${tierShape(athleteLevel())}</span><b>${athleteLevel()}</b><span>nível</span></div>
    <div class="gs-item streak" role="img" aria-label="${st.weeks} semanas seguidas, ${st.shields} proteção"><span class="flame-wrap">${gi('flame')}${st.shields?gi('shield','mini'):''}</span><b>${st.weeks}</b><span>semanas</span></div>
    <div class="gs-item" role="img" aria-label="${w.used} de ${w.goal} janelas na semana"><svg class="wring" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12" class="bg"/><circle cx="15" cy="15" r="12" class="fg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-w.used/w.goal)}"/></svg><b>${w.used}/${w.goal}</b><span>janelas</span></div>
    <div class="gs-item" role="img" aria-label="${fmt(G.pointsWeek)} pontos na semana">${gi('bolt')}<b class="g-grad">${fmt(G.pointsWeek)}</b><span>semana</span></div></div>`;
}
function medalShelf(){
  return `<div class="medal-cards">${G.medals.map(m=>m.got?`<div class="medal-card" style="animation:none"><span class="medal-ic">${gi(m.icon)}</span>${esc(m.name)}</div>`:m.hidden?`<div class="medal-card off" aria-label="Medalha oculta"><span class="medal-ic">${gi('question')}</span>???</div>`:`<div class="medal-card off"><span class="medal-ic">${gi(m.icon)}</span>${esc(m.name)}</div>`).join('')}</div>`;
}
function rankingBox(){
  return `<div class="group-box pad">${rankList().slice(0,5).map((w,i)=>`<div class="rank-row${w.date===TODAY?' me':''}"><span class="rank-pos${i<3?' p'+(i+1):''}">${i+1}</span><span class="rank-main"><strong>Letra ${w.day} · ${esc(D.program.days[w.day].label)}</strong><span>${cap(fmtShort(w.date))}</span></span><span class="rank-pts">${gi('bolt')}${fmt(w.pts)}</span></div>`).join('')}</div>`;
}

/* Navegação e render */
const stage=document.getElementById('stage'),notes=document.getElementById('notes'),idx=document.getElementById('idx');
function renderIndexOnce(){
  idx.innerHTML=`<h2 class="idx-title">Telas</h2>`+Object.entries(GROUP_LABEL).map(([k,l])=>`<div class="idx-group"><h2>${l}</h2><div class="idx-items">${SCREENS.filter(s=>s.group===k).map(s=>`<button class="idx-item" data-act="idx" data-arg="${s.id}">${esc(s.title)}</button>`).join('')}</div></div>`).join('');
}
function render(){
  const a=document.activeElement;let sel=null;
  if(a&&a.dataset){if(a.dataset.drag)sel=`[data-drag="${a.dataset.drag}"]`;else if(a.dataset.act)sel=`[data-act="${a.dataset.act}"]${a.dataset.arg?`[data-arg="${a.dataset.arg}"]`:''}`;}
  idx.querySelectorAll('.idx-item').forEach(b=>{if(b.dataset.arg===S.screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const mac=SCREEN[S.screen].group==='mac';
  stage.className='stage'+(mac?' stage-mac':'');
  stage.innerHTML=mac?macHTML():phoneHTML();
  const s=SCREEN[S.screen];
  notes.innerHTML=`<p class="eyebrow">${esc(GROUP_LABEL[s.group])}</p><h2 class="notes-title">${esc(s.title)}</h2><p class="refs">${esc(s.refs)}</p><ul class="notes-list">${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`;
  if(sel){const el=document.querySelector(sel);if(el&&el!==document.activeElement)el.focus({preventScroll:true});}
  const og=document.getElementById('opt-game');if(og)og.checked=S.full;
  afterRender();
}
function prepare(id){
  if(!FLOW_IDS.includes(id))return;
  if(!S.flow||S.phase==='done')startFlow('A');
  if(id==='serie'){if(S.phase==='rest')advance();if(S.phase==='done')startFlow('A');S.sheet=null;}
  if(id==='descanso'||id==='correcao'){if(S.phase!=='rest')logSet();S.sheet=null;}
  if(id==='fim')autoComplete();
}
function go(id,opts={}){
  if(!SCREEN[id])id='entrar';
  if(opts.fromIndex)prepare(id);
  const sc=SCREEN[id];
  if(id!=='serie'&&S.timed)cancelExec();
  if(!FLOW_IDS.includes(id))stopTimer();else if(S.phase==='rest')resumeRest();
  if(sc.group==='full')S.full=true;else if(sc.group==='mvp'&&!FLOW_IDS.includes(id))S.full=false;
  if(S.sheet==='start'||S.sheet==='end')S.sheet=null;
  if(id==='sequencia')S.sheet='seq';else if(S.sheet==='seq')S.sheet=null;
  if(id==='grupo')S.sheet='grupo';else if(S.sheet==='grupo')S.sheet=null;
  if(id==='correcao'){if(S.sheet!=='correcao')openCorrection();}else if(S.sheet==='correcao')S.sheet=null;
  if(sc.group!=='mac')S.admSheet=null;
  S.banner=id==='aviso';
  S.screen=id;
  if(location.hash.slice(1)!==id){try{history.replaceState(null,'','#'+id);}catch(_){}}
  render();
}
function announce(t){const l=document.getElementById('live');l.textContent='';setTimeout(()=>{l.textContent=t;},30);}
let toastT=null;
function toast(msg){
  const host=document.getElementById('toast-host');if(!host)return;
  host.innerHTML=`<div class="toast glass" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>{const h=document.getElementById('toast-host');if(h)h.innerHTML='';},2600);
}
function closeSheet(){
  if(S.sheet==='start'){S.sheet=null;render();return;}
  if(S.sheet==='seq'){S.sheet=null;if(S.phase==='rest'&&S.restLeft<=0){advance();go(S.screen);}else go(S.phase==='rest'?'descanso':'serie');return;}
  if(S.sheet==='end'){S.sheet=null;if(S.phase==='rest'&&S.restLeft<=0){advance();go(S.screen);}else render();return;}
  if(S.screen==='correcao'){S.sheet=null;if(S.restLeft<=0){advance();go(S.screen);}else go('descanso');}
  else if(S.screen==='grupo'){go('mapa');}
}

function handle(act,arg){
  const now=Date.now();
  switch(act){
    case 'go':go(arg);break;
    case 'idx':go(arg,{fromIndex:true});break;
    case 'start-day':S.pendingDay=arg;S.banner=false;S.sheet='start';render();break;
    case 'confirm-start':S.sheet=null;startFlow(S.pendingDay);go('serie');break;
    case 'done':
      if(now-S.lastDone<800)return;
      if(item().kind==='time'||D.exercises[item().ex].kind==='time'){startExec();render();break;}
      S.lastDone=now;logSet();go('descanso');break;
    case 'exec-done':if(S.timed&&S.timed.stage==='run')finishExec(S.timed.total-S.timed.left);break;
    case 'exec-cancel':cancelExec();render();break;
    case 'next':
      if(now-S.lastDone<800)return;
      advance();go(S.screen);break;
    case 'end-workout':if(S.screen==='sequencia')S.screen=S.phase==='rest'?'descanso':'serie';S.sheet='end';try{history.replaceState(null,'','#'+S.screen);}catch(_){}render();break;
    case 'open-seq':go('sequencia');break;
    case 'seq-go':{const i=+arg;if(S.phase==='rest'){S.flow.target=i;S.flow.skipped=S.flow.skipped.filter(x=>x!==i);go('descanso');}else{switchTo(i);go('serie');}break;}
    case 'seq-skip':{const i=upcoming();if(i<0)break;S.flow.skipped.push(i);
      if(S.phase==='rest'){S.flow.target=null;if(afterSet()<0){go('descanso');S.sheet='end';render();}else go('descanso');}
      else{const nx=nextIndex(i);if(nx<0){go('serie');S.sheet='end';render();}else{switchTo(nx);go('serie');}}
      break;}
    case 'confirm-end':S.sheet=null;finish();go('fim');break;
    case 'open-correction':openCorrection();go('correcao');break;
    case 'save-correction':{
      const l=S.current[S.current.length-1];l.loadKg=S.edit.loadKg;if(l.kind==='reps')l.reps=S.edit.reps;else l.seconds=S.edit.seconds;
      S.sheet=null;if(S.restLeft<=0){advance();go(S.screen);}else go('descanso');
      toast(`Série corrigida: ${setText(l)}`);break;}
    case 'close-sheet':case 'close-sheet-bg':closeSheet();break;
    case 'inc':case 'dec':{const [sc,f]=arg.split(':');setField(sc,f,scopeObj(sc)[f]+(act==='inc'?1:-1)*STEP[f]);updateAdj(sc,f);break;}
    case 'open-group':S.group=arg;go('grupo');break;
    case 'banner-open':go('mapa');break;
    case 'mail-open':S.mail=+arg;render();break;
    case 'mail-back':S.mail=null;render();break;
    case 'noop':break;
    case 'close-banner':go('sugestao');break;
    case 'simulate-notice':S.notice=S.notice==='window'?'drop':'window';go('aviso');if(S.notice==='drop')SFX.warn();break;
    case 'reset':stopTimer();stopExec();D=makeData();S=freshState();G=freshGame();Object.keys(WINDOWS0).forEach(k=>{WINDOWS[k]={...WINDOWS0[k]};});document.getElementById('opt-sound').checked=true;document.getElementById('opt-offline').checked=false;document.getElementById('opt-fast').checked=true;go('entrar');break;
    case 'adm-new-exercise':S.admSheet='exercise';render();document.getElementById('f-ex-name')?.focus();break;
    case 'adm-new-muscle':S.admSheet='muscle';render();document.getElementById('f-mu-name')?.focus();break;
    case 'adm-cancel':S.admSheet=null;render();break;
    case 'adm-day':S.admDay=arg;S.admNotice=null;render();break;
    case 'adm-load':{
      const [i,dir]=arg.split(':').map(Number);const it=D.program.days[S.admDay].items[i];
      it.loadKg=Math.max(0,it.loadKg+dir*2.5);delete it.lastKg;
      S.admNotice=`${D.exercises[it.ex].name}: próximo treino com ${fmt(it.loadKg)} kg`;
      render();break;}
    case 'adm-filter':S.filter=arg;S.selected=null;render();break;
    case 'adm-select':S.selected=arg;render();break;
    case 'adm-remove':if(S.selected){S.admSheet='confirm';render();}break;
    case 'adm-confirm-remove':S.history=S.history.filter(w=>w.id!==S.selected);S.selected=null;S.admSheet=null;render();toast('Treino removido do histórico.');break;
  }
}
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.act==='close-sheet-bg'&&e.target!==el)return;
  handle(el.dataset.act,el.dataset.arg||'');
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const err=document.getElementById('adm-error');
  if(e.target.id==='form-ex'){
    const name=document.getElementById('f-ex-name').value.trim();
    const kind=(document.querySelector('input[name="f-ex-kind"]:checked')||{}).value||'reps';
    const muscles=[...document.querySelectorAll('input[name="f-ex-muscle"]:checked')].map(i=>i.value);
    if(!name){err.textContent='informe o nome do exercício';return;}
    if(!muscles.length){err.textContent='informe ao menos um músculo';return;}
    D.exercises['x'+(++S.seq)]={name,kind,muscles};S.admSheet=null;render();toast('Exercício cadastrado.');
  }
  if(e.target.id==='form-mu'){
    const name=document.getElementById('f-mu-name').value.trim(),group=document.getElementById('f-mu-group').value;
    if(!name){err.textContent='informe o nome do músculo';return;}
    if(!group){err.textContent='informe o grupo muscular';return;}
    D.muscles.push({id:'m'+(++S.seq),name,group});S.admSheet=null;render();toast('Músculo cadastrado.');
  }
});
let drag=null;
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-drag]');if(!el)return;
  const [sc,f]=el.dataset.drag.split(':');
  drag={el,sc,f,y:e.clientY,start:scopeObj(sc)[f],id:e.pointerId};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dy=e.clientY-drag.y,steps=Math.round(dy/22);
  const target=drag.start+steps*STEP[drag.f];
  setField(drag.sc,drag.f,target);updateAdj(drag.sc,drag.f);
  drag.el.querySelector('.wheel').style.transform=`translateY(${target<MIN[drag.f]?0:dy-steps*22}px)`;
});
const endDrag=()=>{if(!drag)return;drag.el.classList.remove('dragging');drag.el.querySelector('.wheel').style.transform='';drag=null;};
/* Wheel up moves the strip down, like a finger drag down: the value goes up. */
let wheelAcc=0;
document.addEventListener('wheel',e=>{
  const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;
  e.preventDefault();wheelAcc-=e.deltaY;
  const steps=Math.trunc(wheelAcc/40);if(!steps)return;wheelAcc-=steps*40;
  const [sc,f]=el.dataset.drag.split(':');setField(sc,f,scopeObj(sc)[f]+steps*STEP[f]);updateAdj(sc,f);
},{passive:false});
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
document.addEventListener('keydown',e=>{
  const sp=e.target.closest&&e.target.closest('[data-drag]');
  if(sp&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){
    e.preventDefault();const [sc,f]=sp.dataset.drag.split(':');const dir=(e.key==='ArrowUp'||e.key==='ArrowRight')?1:-1;
    setField(sc,f,scopeObj(sc)[f]+dir*STEP[f]);updateAdj(sc,f);return;
  }
  if(e.key==='Escape'){if(S.sheet)closeSheet();else if(S.admSheet){S.admSheet=null;render();}}
});
document.getElementById('opt-offline').addEventListener('change',e=>{
  S.online=!e.target.checked;
  if(S.online&&S.pending){
    const n=S.pending;S.pending=0;S.current.forEach(s=>{s.synced=true;});S.history.forEach(w=>w.sets.forEach(s=>{s.synced=true;}));
    render();toast(`${n} ${n===1?'série enviada':'séries enviadas'} ao servidor.`);
  }else render();
});
document.getElementById('opt-game').addEventListener('change',e=>{
  S.full=e.target.checked;
  if(!S.full&&SCREEN[S.screen].group==='full')go('treino-do-dia');
  else if(S.full&&S.screen==='treino-do-dia')go('sugestao');
  else render();
});
document.getElementById('opt-sound').addEventListener('change',e=>{S.sound=e.target.checked;if(S.sound)SFX.points(false);});
document.getElementById('opt-fast').addEventListener('change',e=>{S.fast=e.target.checked;if(S.timer){stopTimer();resumeRest();}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==S.screen&&SCREEN[h])go(h,{fromIndex:true});});

renderIndexOnce();
const h0=location.hash.slice(1);
go(SCREEN[h0]?h0:'entrar',{fromIndex:true});
})();
</script>
